# -- Bluetooth name patterns (substring match, case-insensitive) -------------
#
# Used for BT discovery (is_matching_bt_name) and family detection
# (family_for_model_hint). The brand names "supvan" and "katasymbol" are
# always accepted for discovery but don't select a specific family.
#
# `t0117`/`t0143`-style entries are firmware *hardware codes* from the serial
# name a printer broadcasts over BT (e.g. `T0143F2408183024` = E10).

[bt_patterns]
supvan_t50 = ["t50", "t0117"]
# The whole E-series is one BT-only class speaking one print flow. Only the
# E10/E10pro is captured; E11/E12/E16 are routed here on the strength of that,
# since the T50 flow prints them blank. `e-series` catches the placeholder
# model name a BLE-only candidate gets when no RD_DEV_NAME probe is possible
# (BLE discovery only ever scans for this class — see ble_discover).
supvan_e = ["e10", "e11", "e12", "e16", "e-series", "t0143"]
supvan_t80 = ["t80"]
supvan_g = ["g11", "g15", "g18"]
supvan_tp76 = ["tp76"]
supvan_tp80 = ["tp80"]
supvan_tp86 = ["tp86"]
supvan_sp650 = ["sp650"]
