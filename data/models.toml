# Supvan printer model registry.
#
# Dimensions are in millimetres. PWG media names and hundredths-of-mm sizes
# are derived at load time.

# -- Driver families ---------------------------------------------------------

[[families]]
name = "supvan_t50"
description = "Supvan T50 Series"
dpi = 203
printhead_dots = 384
media_mm = [
    [40, 30], [40, 40], [40, 50], [40, 60], [40, 70], [40, 80],
    [30, 15], [30, 20], [30, 30], [30, 40],
    [48, 30], [48, 45], [48, 70],
    [25, 25],
    [50, 30],
]

[[families]]
name = "supvan_e"
description = "Supvan E Series"
dpi = 203
# 96 dots = 12 mm of print on 15 mm tape. Recovered from an HCI capture of the
# vendor Android app printing to an E10pro: its buffers carry
# per_line_byte = 12. E11/E12/E16 are the same BT-only class and share this
# print flow; their heads are unverified, but under-declaring one only narrows
# the printable band, whereas over-declaring prints nothing at all. Split them
# into their own family once a capture gives a real `per_line_byte`.
# The E-series speaks a different print flow — see `profile` and
# `supvan_proto::profile::PrintProfile`.
printhead_dots = 96
profile = "e-series"
media_mm = [
    [12, 20], [12, 30], [12, 40],
    [15, 20], [15, 30], [15, 40], [15, 50],
    [20, 20], [20, 30], [20, 40],
    [25, 30], [25, 40], [25, 50],
]

